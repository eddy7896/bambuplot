[project]
name = "bambuplot"
version = "0.1.0"
description = "Turn images into pen-plotter G-code for the Bambu Lab A1 Mini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "paho-mqtt>=2.0",
    "svgelements>=1.9",
    "scikit-image>=0.22",
]

[project.scripts]
bambuplot = "bambuplot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambuplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
